version: '3.9'

services:
  # ===== REST API Service =====
  sheikha-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sheikha-cloud-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongodb:27017/sheikha-cloud
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./backups:/app/backups
    networks:
      - sheikha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== MongoDB Database =====
  mongodb:
    image: mongo:7.0-alpine
    container_name: sheikha-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: sheikha-cloud
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - sheikha-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis Cache =====
  redis:
    image: redis:7-alpine
    container_name: sheikha-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    networks:
      - sheikha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Prometheus Monitoring =====
  prometheus:
    image: prom/prometheus:latest
    container_name: sheikha-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - sheikha-network
    restart: unless-stopped

  # ===== Grafana Dashboards =====
  grafana:
    image: grafana/grafana:latest
    container_name: sheikha-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - sheikha-network
    restart: unless-stopped

  # ===== PostgreSQL Database (Optional) =====
  postgresql:
    image: postgres:15-alpine
    container_name: sheikha-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: sheikha_cloud
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sheikha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== pgAdmin (PostgreSQL Management) =====
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sheikha-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sheikha.app
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgresql
    networks:
      - sheikha-network
    restart: unless-stopped

  # ===== Sentry Error Tracking =====
  sentry:
    image: sentry:latest
    container_name: sheikha-sentry
    ports:
      - "9000:9000"
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-generate-a-random-secret}
      SENTRY_ALLOWED_HOSTS: '*'
    volumes:
      - sentry-data:/var/lib/sentry/files
    depends_on:
      - postgres-sentry
      - redis
    networks:
      - sheikha-network
    restart: unless-stopped

  # ===== PostgreSQL for Sentry =====
  postgres-sentry:
    image: postgres:15-alpine
    container_name: sheikha-postgres-sentry
    environment:
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: ${SENTRY_DB_PASSWORD:-sentry123}
      POSTGRES_DB: sentry
    volumes:
      - postgres-sentry-data:/var/lib/postgresql/data
    networks:
      - sheikha-network
    restart: unless-stopped

  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    container_name: sheikha-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - sheikha-api
      - grafana
    networks:
      - sheikha-network
    restart: unless-stopped

  # ===== MinIO Object Storage =====
  minio:
    image: minio/minio:latest
    container_name: sheikha-minio
    ports:
      - "9001:9001"
      - "9002:9002"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /minio_data --console-address ":9001"
    volumes:
      - minio-data:/minio_data
    networks:
      - sheikha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

# ===== Volumes =====
volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  postgres-sentry-data:
    driver: local
  pgadmin-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  sentry-data:
    driver: local
  nginx-cache:
    driver: local
  minio-data:
    driver: local

# ===== Networks =====
networks:
  sheikha-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
