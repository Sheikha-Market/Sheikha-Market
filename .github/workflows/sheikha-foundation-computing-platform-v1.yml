name: 🧱 Sheikha Foundation V1

on:
  pull_request:
    paths:
      - "runtime/sheikha-foundation-computing-platform-v1/**"
      - "tools/database/postgresql/sheikha-foundation-computing-platform-v1/**"
      - ".github/workflows/sheikha-foundation-computing-platform-v1.yml"
  push:
    branches: [main]
    paths:
      - "runtime/sheikha-foundation-computing-platform-v1/**"
      - "tools/database/postgresql/sheikha-foundation-computing-platform-v1/**"
      - ".github/workflows/sheikha-foundation-computing-platform-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-v1:
    name: 🧱 Foundation V1 Clean Checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find runtime/sheikha-foundation-computing-platform-v1 \
            -maxdepth 1 -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check
          node --check \
            tools/database/postgresql/sheikha-foundation-computing-platform-v1/sheikha-postgres-schema-provisioner-v1.js
      - name: Validate foundation manifest JSON
        run: >-
          node -e "JSON.parse(require('node:fs').readFileSync(
          'runtime/sheikha-foundation-computing-platform-v1/foundation-manifest-v1.json',
          'utf8'))"
      - name: Run foundation contract assertions
        shell: bash
        run: |
          node runtime/sheikha-foundation-computing-platform-v1/test.js \
            | tee /tmp/sheikha-foundation-v1-test.log
          grep -Fxq \
            'SHEIKHA_FOUNDATION_V5_AUTHORIZATION_GOVERNANCE_REPAIR_STATIC_TEST_TARGET_READY=true' \
            /tmp/sheikha-foundation-v1-test.log
