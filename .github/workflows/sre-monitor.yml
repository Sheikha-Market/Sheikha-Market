name: "🔭 SRE Monitor — Sheikha Health Check"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "SHEIKHA_V*_SEAL.json"

permissions:
  contents: read

concurrency:
  group: sheikha-sre-monitor-v61
  cancel-in-progress: true

jobs:
  sre-omni-radar-21:
    name: "29/29 Sovereign Endpoints & Fail-Closed Guard"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "🌐 Probe All 29 Sovereign Endpoints (12 Zones + 17 Subdomains) & V61 Portals"
        shell: bash
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import concurrent.futures
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone

          ENDPOINTS_21 = [
              # 12 Sovereign Zones
              "https://sheikha.top/",
              "https://sheikha.dev/api/health",
              "https://sheikha.cloud/api/health",
              "https://sheikha.app/api/health",
              "https://sheikha.digital/api/health",
              "https://sheikha.market/api/v46/matrix",
              "https://sheikha.shop/api/v46/matrix",
              "https://sheikha.capital/api/v46/matrix",
              "https://sheikha.money/api/v46/matrix",
              "https://sheikha.me/",
              "https://sheikha.site/",
              "https://sheikha.click/",
              # 9 Sovereign Subdomains
              "https://os.sheikha.top/api/health",
              "https://kernel.sheikha.top/api/health",
              "https://comms.sheikha.top/api/v46/os-comms/status",
              "https://commerce.sheikha.top/api/v46/matrix",
              "https://sovereign-ai.sheikha.top/api/health",
              "https://admin.sheikha.top/api/health",
              "https://query.sheikha.top/api/health",
              "https://monitor.sheikha.top/api/health",
              "https://api.sheikha.top/api/health",
              # 6 Dedicated Engine Custom Domains (V62.0)
              "https://treasury.sheikha.top/",
              "https://mesh.sheikha.top/",
              "https://hub.sheikha.top/",
              "https://management.sheikha.top/",
              "https://twin.sheikha.top/",
              "https://business.sheikha.top/",
              "https://sellers.sheikha.top/api/health",
              "https://ilm.sheikha.top/api/health",
          ]

          PORTALS_V61 = [
              "https://os.sheikha.top/meta-hub",
              "https://sheikha.dev/vscoder-studio",
              "https://os.sheikha.top/tawheed-nexus",
              "https://sheikha.money/treasury-vaults",
          ]

          FAIL_CLOSED_GATES = [
              "https://os.sheikha.top/api/v61/meta/dispatch",
              "https://sheikha.money/api/v58/treasury/transfer",
              "https://os.sheikha.top/api/v55/nexus/execute",
          ]

          def check_get(url: str) -> tuple[str, int, int, bool]:
              p = subprocess.run(
                  ["curl", "-4", "-sS", "-L", "-o", "/dev/null",
                   "--connect-timeout", "10", "--max-time", "20",
                   "--retry", "3", "--retry-delay", "2", "--retry-all-errors",
                   "-w", "%{http_code}:%{ssl_verify_result}", url],
                  capture_output=True, text=True
              )
              if p.returncode == 0 and ":" in p.stdout:
                  h, t = p.stdout.strip().split(":", 1)
                  http_code, tls_res = int(h), int(t)
              else:
                  http_code, tls_res = 0, 1
              return (url, http_code, tls_res, http_code == 200 and tls_res == 0)

          def check_gate_401(url: str) -> tuple[str, int, bool]:
              p = subprocess.run(
                  ["curl", "-4", "-sS", "-X", "POST", "-o", "/dev/null",
                   "--connect-timeout", "10", "--max-time", "20",
                   "--retry", "3", "--retry-delay", "2",
                   "-w", "%{http_code}", url],
                  capture_output=True, text=True
              )
              code = int(p.stdout.strip()) if p.returncode == 0 and p.stdout.strip().isdigit() else 0
              return (url, code, code == 401)

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              ep_results = list(pool.map(check_get, ENDPOINTS_21))
              ui_results = list(pool.map(check_get, PORTALS_V61))
              gate_results = list(pool.map(check_gate_401, FAIL_CLOSED_GATES))

          ep_pass = sum(1 for r in ep_results if r[3])
          ui_pass = sum(1 for r in ui_results if r[3])
          gate_pass = sum(1 for r in gate_results if r[2])

          lines = [
              "## 🔭 Sheikha Sovereign SRE Radar V61.1",
              f"- **UTC Timestamp:** `{datetime.now(timezone.utc).isoformat()}`",
              f"- **Sovereign Endpoints:** `{ep_pass}/{len(ENDPOINTS_21)} GREEN`",
              f"- **V61 Live Portals:** `{ui_pass}/{len(PORTALS_V61)} GREEN`",
              f"- **Fail-Closed 401 Gates:** `{gate_pass}/{len(FAIL_CLOSED_GATES)} ENFORCED`",
              "",
              "| Endpoint / Gate | HTTP | TLS | Verdict |",
              "|---|---|---|---|",
          ]

          for url, h, t, ok in ep_results + ui_results:
              verdict = "GREEN" if ok else "DEGRADED"
              print(f"[{verdict}] {url} -> HTTP={h} TLS={t}")
              lines.append(f"| `{url}` | `{h}` | `{t}` | **{verdict}** |")

          for url, code, ok in gate_results:
              verdict = "LOCKED_401" if ok else "UNEXPECTED"
              print(f"[{verdict}] {url} -> HTTP={code}")
              lines.append(f"| `{url}` (POST Guard) | `{code}` | `0` | **{verdict}** |")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write("\n".join(lines) + "\n")

          if ep_pass != len(ENDPOINTS_21) or ui_pass != len(PORTALS_V61) or gate_pass != len(FAIL_CLOSED_GATES):
              sys.exit(1)

          print("🏆 ALL 29 SOVEREIGN ENDPOINTS + 4 PORTALS + 3 FAIL-CLOSED GATES PASSED 100%!")
          EOF
