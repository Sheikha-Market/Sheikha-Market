# بسم الله الرحمن الرحيم
# Deploy to Hostinger VPS via SSH + PM2
name: 🚀 Deploy Sheikha to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  pre-deploy:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Validate Node.js syntax
        run: |
          [ -f server.js ] || { echo "❌ server.js غير موجود"; exit 1; }
          node --check server.js && echo "✅ server.js صحيح"

      - name: 📋 Check package.json
        run: |
          node -e "require('./package.json')" && echo "✅ package.json صحيح"

  deploy:
    name: Deploy to Hostinger VPS
    needs: pre-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          debug: true
          script: |
            echo "=== STEP 1: navigate ==="
            cd /opt/sheikha/current && echo "OK: cd"

            echo "=== STEP 2: git fetch ==="
            git fetch origin main && echo "OK: fetch"

            echo "=== STEP 3: git reset ==="
            git reset --hard origin/main && echo "OK: reset"

            echo "=== STEP 4: check server.js ==="
            ls -la server.js && echo "OK: server.js"

            echo "=== STEP 5: git diff ==="
            CHANGED=$(git diff HEAD~1 --name-only 2>/dev/null || echo "")
            echo "CHANGED: $CHANGED"

            echo "=== STEP 6: pm2 check ==="
            pm2_running=$(pm2 list 2>/dev/null | grep -c "sheikha-main-portal" || echo "0")
            echo "pm2_running: $pm2_running"

            echo "=== STEP 7: mkdir logs ==="
            mkdir -p /var/log/sheikha && echo "OK: mkdir"

            echo "=== STEP 8: pm2 reload ==="
            if [ "$pm2_running" -gt "0" ]; then
              pm2 reload sheikha-main-portal --update-env && echo "OK: reload"
            else
              pm2 start server.js --name sheikha-main-portal && pm2 save && echo "OK: start"
            fi

            echo "=== STEP 9: wait ==="
            sleep 5

            echo "=== STEP 10: health check ==="
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://localhost:8080/api/health || echo "000")
            echo "HTTP_CODE: $HTTP_CODE"
            if [ "$HTTP_CODE" = "000" ]; then
              echo "❌ الخادم لا يستجيب"
              pm2 logs sheikha-main-portal --lines 20 --nostream
              exit 1
            fi

            echo "=== DONE: HTTP $HTTP_CODE ==="
            echo "🎉 تم النشر - $(date '+%Y-%m-%d %H:%M:%S')"

      - name: ✅ Deployment successful
        if: success()
        run: |
          echo "✅ النشر نجح - Commit: ${{ github.sha }}"

      - name: ❌ Deployment failed
        if: failure()
        run: |
          echo "❌ فشل النشر"
          exit 1
