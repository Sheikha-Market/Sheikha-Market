# بسم الله الرحمن الرحيم
# Deploy to Hostinger VPS via SSH + PM2
name: Deploy Sheikha to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  pre-deploy:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate server.js
        run: |
          [ -f server.js ] || { echo "server.js not found"; exit 1; }
          node --check server.js && echo "server.js OK"

      - name: Check package.json
        run: node -e "require('./package.json')" && echo "package.json OK"

  deploy:
    name: Deploy to Hostinger VPS
    needs: pre-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            APP_PATH="/opt/sheikha/current"
            PM2_NAME="sheikha-main-portal"

            echo "==> cd $APP_PATH"
            cd "$APP_PATH" || { echo "FAIL: cannot cd to $APP_PATH"; exit 1; }

            echo "==> git fetch origin main"
            git fetch origin main

            echo "==> git reset --hard origin/main"
            git reset --hard origin/main

            COMMIT=$(git rev-parse --short HEAD)
            echo "==> HEAD: $COMMIT"

            if [ ! -f server.js ]; then
              echo "FAIL: server.js not found after reset"
              ls -la
              exit 1
            fi
            echo "==> server.js OK"

            echo "==> npm ci"
            npm ci --omit=dev 2>&1 | tail -5

            mkdir -p /var/log/sheikha

            echo "==> PM2 reload/start"
            if pm2 describe "$PM2_NAME" > /dev/null 2>&1; then
              pm2 reload "$PM2_NAME" --update-env
            else
              pm2 start server.js --name "$PM2_NAME" \
                --max-memory-restart 1500M \
                --restart-delay 3000 \
                --max-restarts 10 \
                --log /var/log/sheikha/app.log \
                --error /var/log/sheikha/error.log
              pm2 save
            fi

            sleep 6

            echo "==> Health check"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://localhost:8080/api/health || echo "000")
            echo "==> HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" = "000" ]; then
              echo "FAIL: server not responding"
              pm2 logs "$PM2_NAME" --lines 20 --nostream
              exit 1
            fi

            DISK_USED="$(df -P / | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
            echo "==> Disk: ${DISK_USED}%"

            echo "==> Deploy OK - commit $COMMIT - HTTP $HTTP_CODE"

      - name: Deployment successful
        if: success()
        run: |
          echo "Deploy succeeded"
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"

      - name: Deployment failed
        if: failure()
        run: echo "Deploy FAILED - check logs above" && exit 1
