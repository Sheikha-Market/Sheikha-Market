# بسم الله الرحمن الرحيم
# Deploy to Hostinger VPS via SSH + PM2
name: 🚀 Deploy Sheikha to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  pre-deploy:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Validate Node.js syntax
        run: |
          [ -f server.js ] || { echo "❌ server.js غير موجود"; exit 1; }
          node --check server.js && echo "✅ server.js صحيح"

      - name: 📋 Check package.json
        run: |
          node -e "require('./package.json')" && echo "✅ package.json صحيح"

  deploy:
    name: Deploy to Hostinger VPS
    needs: pre-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            APP_PATH="/opt/sheikha/current"
            PM2_NAME="sheikha-main-portal"

            cd "$APP_PATH"
            echo "📁 مسار التطبيق: $APP_PATH"

            # سحب آخر التغييرات
            echo "🔄 سحب التحديثات من origin/main..."
            git fetch origin main
            git reset --hard origin/main
            echo "✅ الإصدار: $(git rev-parse --short HEAD)"

            # التحقق من server.js
            ls server.js > /dev/null || { echo "❌ server.js مفقود"; exit 1; }

            # تثبيت الحزم إذا تغير package.json
            CHANGED=$(git diff HEAD~1 --name-only 2>/dev/null || echo "")
            if echo "$CHANGED" | grep -q "package"; then
              echo "📦 تثبيت الحزم..."
              npm ci --omit=dev --prefer-offline
            else
              echo "⏭️ لا تغيير في الحزم"
            fi

            # إنشاء مجلد logs
            mkdir -p /var/log/sheikha

            # إعادة تشغيل التطبيق بـ PM2
            echo "♻️ إعادة تشغيل التطبيق..."
            pm2_running=$(pm2 list 2>/dev/null | grep -c "$PM2_NAME" || echo "0")
            if [ "$pm2_running" -gt "0" ]; then
              pm2 reload "$PM2_NAME" --update-env
            else
              pm2 start server.js --name "$PM2_NAME" \
                --max-memory-restart 1500M \
                --restart-delay 3000 \
                --max-restarts 10 \
                --log /var/log/sheikha/app.log \
                --error /var/log/sheikha/error.log
              pm2 save
            fi

            # انتظار الإقلاع
            sleep 5

            # فحص الصحة
            echo "🏥 فحص الخادم..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://localhost:8080/api/health || echo "000")
            if [ "$HTTP_CODE" = "000" ]; then
              echo "❌ الخادم لا يستجيب"
              pm2 logs "$PM2_NAME" --lines 30 --nostream
              exit 1
            fi

            # فحص القرص
            DISK_USED="$(df -P / | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
            MEM_FREE="$(free -m | awk '/^Mem:/{print $7}')"
            echo "💾 القرص: ${DISK_USED}% | الذاكرة المتاحة: ${MEM_FREE}MB"
            if [ "$DISK_USED" -ge 90 ]; then
              echo "❌ القرص ممتلئ 90%+"; exit 1
            fi

            echo "🎉 تم النشر - HTTP $HTTP_CODE - $(date '+%Y-%m-%d %H:%M:%S')"

      - name: ✅ Deployment successful
        if: success()
        run: |
          echo "📊 ملخص النشر:"
          echo "- ✅ الكود محدّث"
          echo "- ✅ PM2 أعاد التشغيل"
          echo "- ✅ الخادم يستجيب"
          echo "- 🌐 http://31.97.190.74:8080"
          echo "- 📝 Commit: ${{ github.sha }}"
          echo "- 👤 بواسطة: ${{ github.actor }}"

      - name: ❌ Deployment failed
        if: failure()
        run: |
          echo "❌ فشل النشر - راجع السجلات أعلاه"
          exit 1
