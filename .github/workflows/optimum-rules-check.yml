name: Optimum Rules Check

on:
  push:
    branches: [ main, proposal/global-infra-mainline ]
  pull_request:
    branches: [ main, proposal/global-infra-mainline ]

jobs:
  optimum-rules-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Optimum Rules Checker
        run: |
          python3 optimum_rules_checker.py "$(git log -1 --pretty=%B)"
