name: 🚀 Sheikha → Azure Container Apps

on:
  push:
    branches: [ main, review/safe-analysis ]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC — أكثر أماناً من service principal
  contents: read

env:
  AZURE_CONTAINER_APP_NAME: sheikha-portal
  AZURE_RESOURCE_GROUP: sheikha-rg
  REGISTRY_NAME: sheikhaacr
  IMAGE_NAME: sheikha-portal
  NODE_ENV: production

jobs:
  # ═══════════════════════════════════════════════════
  # ١. بناء ودفع Docker image إلى Azure Container Registry
  # ═══════════════════════════════════════════════════
  build-and-push:
    name: 🔨 Build & Push to ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image=${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "latest=${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NODE_ENV=production \
            --label "git.sha=${{ github.sha }}" \
            --label "git.branch=${{ github.ref_name }}" \
            --label "build.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t ${{ steps.meta.outputs.image }} \
            -t ${{ steps.meta.outputs.latest }} \
            ./sheikha-main-portal

      - name: Push to ACR
        run: |
          docker push ${{ steps.meta.outputs.image }}
          docker push ${{ steps.meta.outputs.latest }}

      - name: Output image
        run: echo "✅ Pushed ${{ steps.meta.outputs.image }}"

    outputs:
      image: ${{ steps.meta.outputs.image }}

  # ═══════════════════════════════════════════════════
  # ٢. النشر على Azure Container Apps
  # ═══════════════════════════════════════════════════
  deploy:
    name: 🌍 Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-push
    # environment: production  # مؤقتاً معطّل — الـ OIDC subject يكون ref:branch

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ needs.build-and-push.outputs.image }} \
            --set-env-vars \
              NODE_ENV=production \
              BASE_URL=https://sheikha.top \
              PORT=8080 \
            -o none
          echo "✅ Container App updated"

      - name: Verify deployment health
        run: |
          sleep 30
          STATUS=$(az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.provisioningState" -o tsv)
          echo "Provisioning state: ${STATUS}"
          if [[ "$STATUS" != "Succeeded" ]]; then
            echo "❌ Deployment failed! Status: ${STATUS}"
            exit 1
          fi
          echo "✅ Deployment succeeded"

      - name: Get app URL
        run: |
          URL=$(az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "🌍 App URL: https://${URL}"
          echo "🔗 Custom domain: https://sheikha.top"
