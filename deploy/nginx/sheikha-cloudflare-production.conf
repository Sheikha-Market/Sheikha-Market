# Sheikha production Nginx config
# Install via: sudo bash scripts/install-sheikha-nginx-production.sh

limit_req_zone $binary_remote_addr zone=sheikha_public_rate:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sheikha_admin_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=sheikha_conn_limit:20m;

upstream sheikha_public_upstream {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream sheikha_admin_upstream {
    server 127.0.0.1:8081;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Trust Cloudflare real client IPs
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
include /etc/nginx/conf.d/sheikha-cloudflare-realip.conf;

server {
    listen 80;
    server_name public.sheikha.top;

    access_log /var/log/nginx/sheikha-public.access.log;
    error_log /var/log/nginx/sheikha-public.error.log warn;

    client_max_body_size 20m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    limit_req zone=sheikha_public_rate burst=60 nodelay;
    limit_conn sheikha_conn_limit 80;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /sheikha-health {
        default_type application/json;
        return 200 '{"success":true,"service":"sheikha-public","status":"ok","timestamp":"$time_iso8601"}';
    }

    location = /sheikha-fallback.html {
        root /var/www/sheikha;
        internal;
    }

    error_page 500 502 503 504 /sheikha-fallback.html;

    location ^~ /admin {
        return 403;
    }

    location / {
        proxy_pass http://sheikha_public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name admin.sheikha.top;

    access_log /var/log/nginx/sheikha-admin.access.log;
    error_log /var/log/nginx/sheikha-admin.error.log warn;

    client_max_body_size 10m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    limit_req zone=sheikha_admin_rate burst=20 nodelay;
    limit_conn sheikha_conn_limit 20;

    # Restrict admin to localhost + Tailscale CGNAT range by default.
    allow 127.0.0.1;
    allow 100.64.0.0/10;
    deny all;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /sheikha-health {
        default_type application/json;
        return 200 '{"success":true,"service":"sheikha-admin","status":"ok","timestamp":"$time_iso8601"}';
    }

    location = /sheikha-fallback.html {
        root /var/www/sheikha;
        internal;
    }

    error_page 500 502 503 504 /sheikha-fallback.html;

    location / {
        proxy_pass http://sheikha_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
