server {
    listen 80;
    server_name admin.sheikha.top;

    access_log /var/log/nginx/sheikha-admin.access.log;
    error_log /var/log/nginx/sheikha-admin.error.log warn;

    client_max_body_size 10m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    limit_req zone=sheikha_admin_rate burst=20 nodelay;
    limit_conn sheikha_conn_limit 20;

    allow 127.0.0.1;
    allow 100.64.0.0/10;
    deny all;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /sheikha-health {
        default_type application/json;
        return 200 '{"success":true,"service":"sheikha-admin","status":"ok","timestamp":"$time_iso8601"}';
    }

    location / {
        proxy_pass http://sheikha_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
