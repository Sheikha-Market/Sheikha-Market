server {
    listen 80;
    server_name api.sheikha.top;

    access_log /var/log/nginx/sheikha-api.access.log;
    error_log /var/log/nginx/sheikha-api.error.log warn;

    client_max_body_size 25m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    limit_req zone=sheikha_api_rate burst=50 nodelay;
    limit_conn sheikha_conn_limit 100;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /sheikha-health {
        default_type application/json;
        return 200 '{"success":true,"service":"sheikha-api-gateway","status":"ok","timestamp":"$time_iso8601"}';
    }

    location / {
        proxy_pass http://sheikha_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
