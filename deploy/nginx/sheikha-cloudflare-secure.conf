# Sheikha secure Nginx template (Cloudflare + local services)
# Apply on host: /etc/nginx/sites-available/sheikha

# Public app upstream
upstream sheikha_public_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Admin app upstream
upstream sheikha_admin_upstream {
    server 127.0.0.1:8081;
    keepalive 16;
}

# Map for websocket support
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name public.sheikha.top;

    client_max_body_size 20m;
    proxy_read_timeout 120s;

    # Public reverse proxy
    location / {
        proxy_pass http://sheikha_public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name admin.sheikha.top;

    client_max_body_size 10m;
    proxy_read_timeout 120s;

    # Extra layer: simple IP restriction placeholder (replace with your trusted IP/CIDR)
    # allow 1.2.3.4;
    # deny all;

    location / {
        proxy_pass http://sheikha_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
