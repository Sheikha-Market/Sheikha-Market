# Shared zones and upstreams for split Sheikha Nginx topology.

limit_req_zone $binary_remote_addr zone=sheikha_public_rate:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sheikha_admin_rate:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sheikha_api_rate:20m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=sheikha_conn_limit:20m;

upstream sheikha_public_upstream {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream sheikha_admin_upstream {
    server 127.0.0.1:8081;
    keepalive 16;
}

upstream sheikha_api_upstream {
    server 127.0.0.1:8080;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
