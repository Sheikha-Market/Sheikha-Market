server {
    listen 80;
    server_name public.sheikha.top;

    access_log /var/log/nginx/sheikha-public.access.log;
    error_log /var/log/nginx/sheikha-public.error.log warn;

    client_max_body_size 20m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    limit_req zone=sheikha_public_rate burst=60 nodelay;
    limit_conn sheikha_conn_limit 80;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /sheikha-health {
        default_type application/json;
        return 200 '{"success":true,"service":"sheikha-public","status":"ok","timestamp":"$time_iso8601"}';
    }

    location ^~ /admin {
        return 403;
    }

    location ^~ /api/admin {
        return 403;
    }

    # public.sheikha.top يجب أن يكون proxy_pass فقط بدون static fallback
    location / {
        proxy_pass http://sheikha_public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
