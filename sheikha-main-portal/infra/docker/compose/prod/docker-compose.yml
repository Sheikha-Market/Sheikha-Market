services:
  postgres:
    image: postgres:16-alpine
    container_name: sheikha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sheikha
      POSTGRES_USER: sheikha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheikha -d sheikha"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - back_net

  redis:
    image: redis:7-alpine
    container_name: sheikha-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - back_net

  main-portal:
    build:
      context: /home/sheikha/Projects/sheikha/sheikha-main-portal
      dockerfile: Dockerfile
    image: prod-main-portal
    container_name: sheikha-main-portal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    expose:
      - "8080"
    networks:
      - back_net
      - front_net

  nginx:
    image: nginx:1.27-alpine
    container_name: sheikha-nginx
    restart: unless-stopped
    depends_on:
      main-portal:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/sheikha/Projects/sheikha/sheikha-main-portal/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - front_net
      - back_net

networks:
  front_net:
    name: prod_front_net
  back_net:
    name: prod_back_net

