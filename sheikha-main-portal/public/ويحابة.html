<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ويحابة شيخة — المراسل الإسلامي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --gold:#D4AF37; --copper:#B87333; --dark:#0a0a0a; --dark2:#111; --dark3:#1a1a1a; --dark4:#222; --text:#e8e0d0; --text2:#b0a898; --green:#2ecc71; --blue:#3498db; --teal:#1abc9c; --red:#e74c3c; --wa:#25D366; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Tajawal',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; overflow-x:hidden; }
.hero { background:linear-gradient(135deg,#0a0a0a,#0a1a0a,#0a0a0a); border-bottom:2px solid var(--green); padding:60px 24px 40px; text-align:center; }
.basmala { font-size:clamp(1.4rem,3vw,2rem); color:var(--gold); margin-bottom:16px; font-weight:700; }
.hero-title { font-size:clamp(1.8rem,4vw,3rem); font-weight:900; background:linear-gradient(135deg,var(--green),#fff,var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.hero-sub { color:var(--text2); margin-top:12px; }
nav { background:var(--dark2); border-bottom:1px solid #333; padding:0 24px; display:flex; gap:4px; overflow-x:auto; }
nav a { padding:14px 18px; color:var(--text2); text-decoration:none; font-size:0.9rem; white-space:nowrap; border-bottom:3px solid transparent; }
nav a.active, nav a:hover { color:var(--green); border-color:var(--green); }
.container { max-width:1400px; margin:0 auto; padding:24px; }
.section { display:none; animation:fadeIn .4s; }
.section.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.grid-2 { display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:16px; }
.grid-3 { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
.grid-4 { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
.card { background:var(--dark3); border:1px solid #333; border-radius:12px; padding:20px; transition:.3s; }
.card:hover { border-color:var(--green); transform:translateY(-2px); }
.card-green { border-color:rgba(46,204,113,0.3); background:linear-gradient(135deg,var(--dark3),rgba(46,204,113,0.05)); }
.card-gold { border-color:rgba(212,175,55,0.3); background:linear-gradient(135deg,var(--dark3),rgba(212,175,55,0.05)); }
.card-title { font-size:1rem; font-weight:700; color:var(--green); margin-bottom:8px; }
.card-desc { color:var(--text2); font-size:0.85rem; line-height:1.6; }
.section-title { font-size:1.3rem; font-weight:800; color:var(--green); margin:28px 0 16px; }
.badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:0.75rem; margin:2px; }
.badge-green { background:rgba(46,204,113,0.15); color:var(--green); }
.badge-gold { background:rgba(212,175,55,0.15); color:var(--gold); }
.badge-red { background:rgba(231,76,60,0.15); color:var(--red); }
.loading { color:var(--text2); text-align:center; padding:40px; }
.spinner { width:30px; height:30px; border:3px solid #333; border-top-color:var(--green); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
@keyframes spin { to{transform:rotate(360deg)} }
.compare-row { display:grid; grid-template-columns:2fr 1.5fr 1.5fr 1.5fr 1.5fr; gap:0; border-bottom:1px solid #333; }
.compare-row:first-child { background:var(--dark4); font-weight:700; }
.compare-cell { padding:12px; font-size:0.85rem; }
.vs-good { color:var(--green); }
.vs-bad { color:var(--red); }
.vs-warn { color:#f39c12; }
.feature-icon { font-size:2.5rem; margin-bottom:12px; }
.stat-hero { text-align:center; background:linear-gradient(135deg,rgba(46,204,113,0.1),rgba(212,175,55,0.05)); border:2px solid var(--green); border-radius:16px; padding:32px; margin-bottom:24px; }
.big-n { font-size:3.5rem; font-weight:900; color:var(--green); line-height:1; }
@media (max-width:768px) { .grid-2,.grid-3,.grid-4 { grid-template-columns:1fr; } .compare-row { grid-template-columns:1fr 1fr; } nav a { padding:10px 12px; font-size:0.8rem; } }
</style>
</head>
<body>
<div class="hero">
    <div class="basmala">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
    <div style="font-size:4rem;">💬</div>
    <div class="hero-title">ويحابة شيخة</div>
    <div class="hero-sub">أول تطبيق مراسلة إسلامي متكامل — بديل الواتساب للأمة الإسلامية</div>
    <div style="margin-top:12px; color:var(--green); font-style:italic;">﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾ — المائدة ٢</div>
</div>

<nav>
    <a href="#" class="active" onclick="showSec('sec-overview',this)">🏠 نظرة عامة</a>
    <a href="#" onclick="showSec('sec-features',this)">⚡ الميزات</a>
    <a href="#" onclick="showSec('sec-compare',this)">⚖️ مقارنة</a>
    <a href="#" onclick="showSec('sec-privacy',this)">🔒 الخصوصية</a>
</nav>

<div class="container">

<!-- ══ Overview ══ -->
<div class="section active" id="sec-overview">
    <div id="waihabaHero" class="loading"><div class="spinner"></div></div>
    <div class="grid-4" id="statsGrid"></div>
    <div class="section-title">📱 المنصات المدعومة</div>
    <div id="platforms" class="card card-green"></div>
    <div class="section-title">🌐 اللغات المدعومة</div>
    <div id="languages" class="card card-gold"></div>
</div>

<!-- ══ Features ══ -->
<div class="section" id="sec-features">
    <div class="grid-3" id="featuresGrid"><div class="loading"><div class="spinner"></div></div></div>
</div>

<!-- ══ Compare ══ -->
<div class="section" id="sec-compare">
    <div id="compareGrid"><div class="loading"><div class="spinner"></div></div></div>
</div>

<!-- ══ Privacy ══ -->
<div class="section" id="sec-privacy">
    <div id="privacyDetail"><div class="loading"><div class="spinner"></div></div></div>
</div>

</div>

<script>
const API = async (ep) => { try { const r = await fetch(ep); return r.ok ? r.json() : null; } catch { return null; } };

function showSec(id, el) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    const loaders = { 'sec-overview': loadOverview, 'sec-features': loadFeatures, 'sec-compare': loadCompare, 'sec-privacy': loadPrivacy };
    if (loaders[id]) loaders[id]();
    return false;
}

async function loadOverview() {
    const status = await API('/api/waihaba/status');
    if (!status?.data) return;
    const d = status.data;
    document.getElementById('waihabaHero').innerHTML = `
        <div class="stat-hero">
            <div style="font-size:3rem;">💬</div>
            <div style="font-size:1.4rem;font-weight:900;color:var(--green);margin:8px 0;">${d.name}</div>
            <div style="color:var(--text2);font-size:0.9rem;">${d.quran}</div>
        </div>`;
    document.getElementById('statsGrid').innerHTML = [
        { label: 'الميزات', value: d.features, icon: '⚡' },
        { label: 'المنصات', value: d.platforms, icon: '📱' },
        { label: 'اللغات', value: d.languages, icon: '🌐' },
        { label: 'المستخدمون المستهدفون', value: d.targetUsers, icon: '🌍' },
        { label: 'الرسائل المُرسلة', value: (d.messagesSent||0).toLocaleString(), icon: '💬' },
        { label: 'المستخدمون النشطون', value: (d.activeUsers||0).toLocaleString(), icon: '👥' },
        { label: 'التشغيل', value: d.active ? '🟢 نشط' : '⚠️ انتظار', icon: '✅' },
        { label: 'الإصدار', value: d.version || '1.0.0', icon: '🔖' },
    ].map(s => `<div class="card" style="text-align:center;"><div style="font-size:1.5rem;">${s.icon}</div><div class="big-n" style="font-size:1.6rem;">${s.value}</div><div style="color:var(--text2);font-size:0.8rem;">${s.label}</div></div>`).join('');
    const features = await API('/api/waihaba/features');
    if (features?.data) {
        const f = features.data.find(f => f.id === 'messaging');
        if (f) {
            document.getElementById('platforms').innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:8px;">
                ${['iOS', 'Android', 'Web', 'Windows', 'MacOS', 'Linux'].map(p => `<span class="badge badge-green">📱 ${p}</span>`).join('')}</div>`;
            document.getElementById('languages').innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:8px;">
                ${['العربية', 'English', 'اردو', 'Türkçe', 'فارسی', 'Bahasa Indonesia', 'Bahasa Melayu', 'Hausa', 'বাংলা', 'Français'].map(l => `<span class="badge badge-gold">🌐 ${l}</span>`).join('')}</div>`;
        }
    }
}

async function loadFeatures() {
    const features = await API('/api/waihaba/features');
    if (!features?.data) return;
    document.getElementById('featuresGrid').innerHTML = features.data.map(f => `
        <div class="card card-green">
            <div class="feature-icon">${f.icon||'💬'}</div>
            <div class="card-title">${f.name}</div>
            <div class="card-desc">${f.desc}</div>
            ${f.islamicPrinciple ? `<div style="color:var(--gold);font-size:0.8rem;margin:8px 0;font-style:italic;">${f.islamicPrinciple}</div>` : ''}
            <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:4px;">
                ${(f.features||[]).map(ft => `<span class="badge badge-green">${ft}</span>`).join('')}
                ${(f.types||[]).map(t => `<span class="badge badge-gold">${t.icon} ${t.name}</span>`).join('')}
                ${(f.principles||[]).map(p => `<span class="badge" style="background:rgba(52,152,219,0.15);color:var(--blue);">${p}</span>`).join('')}
            </div>
        </div>`).join('');
}

async function loadCompare() {
    const cmp = await API('/api/waihaba/comparison');
    if (!cmp?.data) return;
    const data = cmp.data;
    document.getElementById('compareGrid').innerHTML = `
        <div class="card">
            <div class="card-title">⚖️ مقارنة شاملة</div>
            <div class="card-desc" style="margin-bottom:16px;">${cmp.data.verdict||''}</div>
            <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;min-width:500px;">
                <tr style="background:var(--dark4);">
                    <th style="padding:10px;text-align:right;color:var(--green);">التطبيق</th>
                    <th style="padding:10px;text-align:center;color:var(--green);">الخصوصية</th>
                    <th style="padding:10px;text-align:center;color:var(--green);">المحتوى الحلال</th>
                    <th style="padding:10px;text-align:center;color:var(--green);">التشفير</th>
                    <th style="padding:10px;text-align:center;color:var(--green);">التقييم</th>
                </tr>
                ${(data.comparison||[]).map(a => `
                    <tr style="border-bottom:1px solid #333;">
                        <td style="padding:10px;font-weight:700;color:${a.app.includes('ويحابة')?'var(--green)':'var(--text)'};">${a.app}</td>
                        <td style="padding:10px;text-align:center;color:${parseInt(a.privacy)>=90?'var(--green)':'#f39c12'};">${a.privacy}</td>
                        <td style="padding:10px;text-align:center;color:${parseInt(a.halal)>=90?'var(--green)':'var(--red)'};">${a.halal}</td>
                        <td style="padding:10px;text-align:center;font-size:0.8rem;">${a.encryption}</td>
                        <td style="padding:10px;text-align:center;">
                            <span style="background:${a.score>=90?'rgba(46,204,113,0.2)':'rgba(231,76,60,0.2)'};color:${a.score>=90?'var(--green)':'var(--red)'};padding:4px 12px;border-radius:20px;font-weight:700;">${a.score}%</span>
                        </td>
                    </tr>`).join('')}
            </table></div>
        </div>`;
}

async function loadPrivacy() {
    const privacy = await API('/api/waihaba/privacy');
    if (!privacy?.data) return;
    const p = privacy.data;
    document.getElementById('privacyDetail').innerHTML = `
        <div class="card card-green" style="margin-bottom:16px;text-align:center;padding:32px;">
            <div style="font-size:3rem;">🔒</div>
            <div style="font-size:1.3rem;font-weight:800;color:var(--green);margin:8px 0;">${p.name}</div>
            <div style="color:var(--text2);">${p.desc}</div>
        </div>
        <div class="section-title">📜 مبادئ الخصوصية الشرعية</div>
        <div class="grid-3">
            ${(p.principles||[]).map(pr => `<div class="card"><div style="color:var(--green);">✅ ${pr}</div></div>`).join('')}
        </div>
        <div class="section-title">⚖️ مقارنة الخصوصية — ويحابة vs واتساب</div>
        <div class="card">
            <table style="width:100%;border-collapse:collapse;">
                <tr style="background:var(--dark4);">
                    <th style="padding:10px;text-align:right;color:var(--green);">الميزة</th>
                    <th style="padding:10px;text-align:center;color:var(--red);">📱 واتساب</th>
                    <th style="padding:10px;text-align:center;color:var(--green);">💬 ويحابة</th>
                </tr>
                ${(p.vs_whatsapp||[]).map(row => `
                    <tr style="border-bottom:1px solid #333;">
                        <td style="padding:10px;">${row.feature}</td>
                        <td style="padding:10px;text-align:center;">${row.whatsapp}</td>
                        <td style="padding:10px;text-align:center;">${row.waihaba}</td>
                    </tr>`).join('')}
            </table>
        </div>`;
}

loadOverview();
</script>
</body>
</html>
