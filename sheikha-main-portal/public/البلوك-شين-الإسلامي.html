<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بلوك شين شيخة — سلسلة الأمانة الإسلامية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --gold:#D4AF37; --copper:#B87333; --dark:#0a0a0a; --dark2:#111; --dark3:#1a1a1a; --dark4:#222; --text:#e8e0d0; --text2:#b0a898; --green:#2ecc71; --blue:#3498db; --purple:#9b59b6; --teal:#1abc9c; --red:#e74c3c; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Tajawal',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; overflow-x:hidden; }
.hero { background:linear-gradient(135deg,#0a0a0a,#0a0a1a,#0a0a0a); border-bottom:2px solid var(--purple); padding:60px 24px 40px; text-align:center; }
.basmala { font-size:clamp(1.4rem,3vw,2rem); color:var(--gold); margin-bottom:16px; font-weight:700; }
.hero-title { font-size:clamp(1.8rem,4vw,3rem); font-weight:900; background:linear-gradient(135deg,var(--purple),var(--blue),var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
nav { background:var(--dark2); border-bottom:1px solid #333; padding:0 24px; display:flex; gap:4px; overflow-x:auto; }
nav a { padding:14px 18px; color:var(--text2); text-decoration:none; font-size:0.9rem; white-space:nowrap; border-bottom:3px solid transparent; }
nav a.active, nav a:hover { color:var(--purple); border-color:var(--purple); }
.container { max-width:1400px; margin:0 auto; padding:24px; }
.section { display:none; animation:fadeIn .4s; }
.section.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.grid-2 { display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:16px; }
.grid-3 { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
.grid-4 { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
.card { background:var(--dark3); border:1px solid #333; border-radius:12px; padding:20px; transition:.3s; }
.card:hover { border-color:var(--purple); transform:translateY(-2px); }
.card-purple { border-color:rgba(155,89,182,0.3); background:linear-gradient(135deg,var(--dark3),rgba(155,89,182,0.05)); }
.card-gold { border-color:rgba(212,175,55,0.3); background:linear-gradient(135deg,var(--dark3),rgba(212,175,55,0.05)); }
.card-title { font-size:1rem; font-weight:700; color:var(--purple); margin-bottom:8px; }
.card-desc { color:var(--text2); font-size:0.85rem; line-height:1.6; }
.section-title { font-size:1.3rem; font-weight:800; color:var(--purple); margin:28px 0 16px; display:flex; align-items:center; gap:8px; }
.badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:0.75rem; margin:2px; }
.badge-purple { background:rgba(155,89,182,0.15); color:var(--purple); }
.badge-gold { background:rgba(212,175,55,0.15); color:var(--gold); }
.badge-blue { background:rgba(52,152,219,0.15); color:var(--blue); }
.loading { color:var(--text2); text-align:center; padding:40px; }
.spinner { width:30px; height:30px; border:3px solid #333; border-top-color:var(--purple); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
@keyframes spin { to{transform:rotate(360deg)} }
.big-n { font-size:2rem; font-weight:900; color:var(--purple); }
.stat-card { background:var(--dark4); border:1px solid rgba(155,89,182,0.3); border-radius:12px; padding:24px; text-align:center; }
.block-chain { display:flex; gap:8px; overflow-x:auto; padding:16px 0; }
.block { background:var(--dark4); border:1px solid var(--purple); border-radius:8px; padding:12px; min-width:160px; font-size:0.8rem; }
.block-hash { color:var(--purple); font-family:monospace; overflow:hidden; text-overflow:ellipsis; font-size:0.7rem; }
.chain-arrow { align-self:center; color:var(--text2); font-size:1.2rem; flex-shrink:0; }
.principle-card { border-left:3px solid var(--gold); padding-right:0; padding-left:16px; border-radius:0 8px 8px 0; border-right:none; }
.quran-ref { color:var(--gold); font-style:italic; font-size:0.8rem; margin-top:8px; }
@media (max-width:768px) { .grid-2,.grid-3,.grid-4 { grid-template-columns:1fr; } nav a { padding:10px 12px; font-size:0.8rem; } }
</style>
</head>
<body>
<div class="hero">
    <div class="basmala">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
    <div style="font-size:4rem;">⛓️</div>
    <div class="hero-title">بلوك شين شيخة الإسلامي</div>
    <div style="color:var(--text2);margin-top:8px;">سلسلة الأمانة — أول بلوك شين شرعي متوافق مع أحكام الإسلام</div>
    <div style="margin-top:12px;color:var(--gold);font-style:italic;">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾ — المائدة ١</div>
</div>

<nav>
    <a href="#" class="active" onclick="showSec('sec-status',this)">📊 الحالة</a>
    <a href="#" onclick="showSec('sec-consensus',this)">🔐 الإجماع</a>
    <a href="#" onclick="showSec('sec-principles',this)">📖 المبادئ</a>
    <a href="#" onclick="showSec('sec-contracts',this)">📜 العقود الذكية</a>
    <a href="#" onclick="showSec('sec-dapps',this)">🚀 التطبيقات</a>
    <a href="#" onclick="showSec('sec-layers',this)">🏗️ الطبقات</a>
</nav>

<div class="container">

<!-- ══ Status ══ -->
<div class="section active" id="sec-status">
    <div id="statusHero" class="loading"><div class="spinner"></div></div>
    <div class="grid-4" id="statsGrid"></div>
    <div class="section-title">⛓️ آخر الكتل</div>
    <div class="block-chain" id="blockChain"></div>
</div>

<!-- ══ Consensus ══ -->
<div class="section" id="sec-consensus">
    <div id="consensusContent" class="loading"><div class="spinner"></div></div>
</div>

<!-- ══ Principles ══ -->
<div class="section" id="sec-principles">
    <div class="grid-3" id="principlesGrid"><div class="loading"><div class="spinner"></div></div></div>
</div>

<!-- ══ Smart Contracts ══ -->
<div class="section" id="sec-contracts">
    <div class="grid-3" id="contractsGrid"><div class="loading"><div class="spinner"></div></div></div>
</div>

<!-- ══ DApps ══ -->
<div class="section" id="sec-dapps">
    <div class="grid-3" id="dappsGrid"><div class="loading"><div class="spinner"></div></div></div>
</div>

<!-- ══ Layers ══ -->
<div class="section" id="sec-layers">
    <div id="layersContent" class="loading"><div class="spinner"></div></div>
</div>

</div>

<script>
const API = async (ep) => { try { const r = await fetch(ep); return r.ok ? r.json() : null; } catch { return null; } };

function showSec(id, el) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    const loaders = { 'sec-status': loadStatus, 'sec-consensus': loadConsensus, 'sec-principles': loadPrinciples, 'sec-contracts': loadContracts, 'sec-dapps': loadDapps, 'sec-layers': loadLayers };
    if (loaders[id]) loaders[id]();
    return false;
}

async function loadStatus() {
    const s = await API('/api/blockchain/status');
    if (!s?.data) return;
    const d = s.data;
    document.getElementById('statusHero').innerHTML = `
        <div style="background:linear-gradient(135deg,rgba(155,89,182,0.1),rgba(52,152,219,0.05));border:2px solid var(--purple);border-radius:16px;padding:32px;text-align:center;margin-bottom:24px;">
            <div style="font-size:2.5rem;">⛓️</div>
            <div style="font-size:1.2rem;font-weight:800;color:var(--purple);margin:8px 0;">${d.name}</div>
            <div style="display:inline-block;background:rgba(46,204,113,0.15);color:var(--green);padding:4px 16px;border-radius:20px;font-size:0.85rem;">${d.active?'🟢 نشط':'⚠️ غير نشط'}</div>
            <div style="color:var(--text2);margin-top:8px;font-size:0.85rem;">${d.desc||''}</div>
        </div>`;
    document.getElementById('statsGrid').innerHTML = [
        { label: 'إجمالي الكتل', value: d.blocks?.toLocaleString()||0, icon: '📦' },
        { label: 'حجم السلسلة', value: d.chainSize+' MB'||0, icon: '💾' },
        { label: 'إجمالي التحقق', value: d.totalValidations?.toLocaleString()||0, icon: '✅' },
        { label: 'العقد النشطة', value: d.activeNodes||0, icon: '🌐' },
        { label: 'آخر كتلة', value: d.latestBlock?.toLocaleString()||0, icon: '🔗' },
        { label: 'وقت الكتلة', value: d.blockTime+'ث', icon: '⏱️' },
        { label: 'رسوم المعاملة', value: d.txFee||'0 DHM', icon: '💰' },
        { label: 'نقاط الأمانة', value: d.trustScore+'%', icon: '⭐' },
    ].map(stat => `<div class="stat-card"><div style="font-size:1.4rem;">${stat.icon}</div><div class="big-n">${stat.value}</div><div style="color:var(--text2);font-size:0.8rem;">${stat.label}</div></div>`).join('');
    if (d.recentBlocks?.length) {
        document.getElementById('blockChain').innerHTML = d.recentBlocks.map((b, i) => `
            ${i>0?'<div class="chain-arrow">←</div>':''}
            <div class="block">
                <div style="color:var(--purple);font-weight:700;">${b.number||i}</div>
                <div style="color:var(--text2);font-size:0.75rem;">⏱️ ${new Date(b.timestamp||Date.now()).toLocaleTimeString('ar')}</div>
                <div style="color:var(--text2);font-size:0.75rem;">📦 ${b.txCount||0} معاملة</div>
                <div class="block-hash">${(b.hash||'0x...').slice(0,20)}...</div>
                <div style="color:var(--gold);font-size:0.75rem;">✅ ${b.validator||'validator'}</div>
            </div>`).join('');
    } else {
        document.getElementById('blockChain').innerHTML = '<div style="color:var(--text2);padding:16px;">لا توجد كتل حتى الآن</div>';
    }
}

async function loadConsensus() {
    const c = await API('/api/blockchain/consensus');
    if (!c?.data) return;
    const d = c.data;
    document.getElementById('consensusContent').innerHTML = `
        <div style="background:linear-gradient(135deg,rgba(155,89,182,0.1),rgba(52,152,219,0.05));border:2px solid var(--purple);border-radius:16px;padding:32px;margin-bottom:24px;">
            <div style="text-align:center;">
                <div style="font-size:3rem;">🤝</div>
                <div style="font-size:1.4rem;font-weight:800;color:var(--purple);margin:8px 0;">${d.name||'إثبات الأمانة'}</div>
                <div style="color:var(--gold);font-style:italic;margin-bottom:12px;">${d.islamicBasis||''}</div>
                <div style="color:var(--text2);">${d.desc||''}</div>
            </div>
        </div>
        <div class="grid-4">
            ${[
                { label:'سرعة التأكيد', value: d.blockTime||'3ث', icon:'⚡' },
                { label:'المدققون', value: d.validators||57, icon:'👥' },
                { label:'كفاءة الطاقة', value: d.energyEfficiency||'99.97% أقل', icon:'🌱' },
                { label:'درجة الأمانة', value: d.trustScore||'100%', icon:'⭐' },
            ].map(s => `<div class="stat-card"><div style="font-size:1.4rem;">${s.icon}</div><div class="big-n" style="font-size:1.5rem;">${s.value}</div><div style="color:var(--text2);font-size:0.8rem;">${s.label}</div></div>`).join('')}
        </div>
        <div class="section-title">🔄 آلية الإجماع</div>
        <div class="grid-3">
            ${(d.steps||[]).map(step => `<div class="card card-purple"><div style="color:var(--purple);font-weight:700;margin-bottom:6px;">⟳ ${step.step||step}</div><div style="color:var(--text2);font-size:0.85rem;">${step.desc||''}</div></div>`).join('')}
        </div>
        <div class="section-title">↗️ مقارنة بالبلوك شين التقليدي</div>
        <div class="grid-3">
            ${(d.comparison||[]).map(c => `<div class="card"><div style="font-weight:700;margin-bottom:8px;">${c.metric}</div><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="color:var(--red);">Bitcoin: ${c.bitcoin}</span></div><div style="display:flex;justify-content:space-between;"><span style="color:var(--purple);">ويحابة: ${c.sheikha}</span></div></div>`).join('')}
        </div>`;
}

async function loadPrinciples() {
    const p = await API('/api/blockchain/principles');
    if (!p?.data) return;
    document.getElementById('principlesGrid').innerHTML = p.data.map(pr => `
        <div class="card principle-card">
            <div style="font-size:1.5rem;margin-bottom:8px;">${pr.icon||'📖'}</div>
            <div class="card-title">${pr.name}</div>
            <div class="card-desc">${pr.desc}</div>
            ${pr.quran ? `<div class="quran-ref">﴿${pr.quran}﴾</div>` : ''}
            ${pr.hadith ? `<div style="color:var(--text2);font-size:0.75rem;margin-top:4px;">«${pr.hadith}»</div>` : ''}
        </div>`).join('');
}

async function loadContracts() {
    const c = await API('/api/blockchain/smart-contracts');
    if (!c?.data) return;
    document.getElementById('contractsGrid').innerHTML = c.data.map(sc => `
        <div class="card card-purple">
            <div style="font-size:1.8rem;margin-bottom:8px;">${sc.icon||'📜'}</div>
            <div class="card-title">${sc.name}</div>
            <div class="card-desc">${sc.desc}</div>
            ${sc.islamicBasis ? `<div style="color:var(--gold);font-size:0.8rem;margin:8px 0;font-style:italic;">${sc.islamicBasis}</div>` : ''}
            <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:4px;">
                ${(sc.params||[]).map(p => `<span class="badge badge-purple">${p}</span>`).join('')}
                ${(sc.rules||[]).slice(0,3).map(r => `<span class="badge badge-blue">${r}</span>`).join('')}
            </div>
        </div>`).join('');
}

async function loadDapps() {
    const d = await API('/api/blockchain/dapps');
    if (!d?.data) return;
    document.getElementById('dappsGrid').innerHTML = d.data.map(app => `
        <div class="card card-gold">
            <div style="font-size:1.8rem;margin-bottom:8px;">${app.icon||'🚀'}</div>
            <div class="card-title" style="color:var(--gold);">${app.name}</div>
            <div class="card-desc">${app.desc}</div>
            <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:4px;">
                ${(app.features||[]).map(f => `<span class="badge badge-gold">${f}</span>`).join('')}
            </div>
            ${app.users ? `<div style="color:var(--text2);font-size:0.8rem;margin-top:8px;">👥 ${app.users} مستخدم</div>` : ''}
        </div>`).join('');
}

async function loadLayers() {
    const l = await API('/api/blockchain/layers');
    if (!l?.data) return;
    document.getElementById('layersContent').innerHTML = `
        <div class="grid-3">
        ${l.data.map(layer => `
            <div class="card card-purple">
                <div style="font-size:1.8rem;margin-bottom:8px;">${layer.icon||'🏗️'}</div>
                <div class="card-title">${layer.name}</div>
                <div class="card-desc">${layer.desc}</div>
                ${layer.throughput ? `<div style="color:var(--green);font-size:0.85rem;margin-top:8px;">⚡ ${layer.throughput}</div>` : ''}
                <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:4px;">
                    ${(layer.features||[]).map(f => `<span class="badge badge-purple">${f}</span>`).join('')}
                </div>
            </div>`).join('')}
        </div>`;
}

loadStatus();
</script>
</body>
</html>
