<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheikha Enterprise Portal | البوابة المؤسسية</title>
    <meta name="description" content="البوابة المؤسسية لمنظومة شيخة على sheikha.top مع تكامل الحساب المؤسسي والشبكة العصبية.">
    <link rel="canonical" href="https://sheikha.top/portal-enterprise.html">
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #070b12;
            color: #f8fafc;
            margin: 0;
            padding: 24px;
        }
        .card {
            max-width: 760px;
            margin: 0 auto;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 22px;
        }
        h1 { margin-top: 0; color: #d4af37; }
        .row { margin: 10px 0; color: #cbd5e1; }
        .ok { color: #22c55e; }
        .btn {
            display: inline-block;
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 10px;
            text-decoration: none;
            background: #d4af37;
            color: #111827;
            font-weight: 700;
        }
        pre {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 12px;
            overflow: auto;
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>البوابة المؤسسية | Sheikha Enterprise</h1>
        <div class="row">النطاق: <strong class="ok">sheikha.top</strong></div>
        <div class="row">المسار المؤسسي: <strong class="ok">/portal-enterprise.html</strong></div>
        <div class="row">تكامل الحساب المؤسسي والشبكة العصبية:</div>
        <pre id="status">جاري تحميل الحالة...</pre>
        <a class="btn" href="/لوحة-الشركة.html?mode=enterprise">دخول لوحة المؤسسة</a>
    </div>

    <script>
        fetch('/api/enterprise/status')
            .then((r) => r.json())
            .then((d) => {
                document.getElementById('status').textContent = JSON.stringify(d, null, 2);
            })
            .catch((e) => {
                document.getElementById('status').textContent = 'فشل جلب الحالة: ' + e.message;
            });
    </script>
</body>
</html>
