<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖👑 روبوت شيخة الرقمي الجميل المتحرك - BOUND_BY_QURAN_SUNNAH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0a0e1a 0%,#1a2332 50%,#0f172a 100%);font-family:'Segoe UI',system-ui;min-height:100vh;overflow:hidden}
#robot-container{position:fixed;bottom:20px;right:20px;width:120px;height:120px;z-index:9999;cursor:pointer;transition:all 0.5s cubic-bezier(0.68,-0.55,0.265,1.55)}
#robot{width:100%;height:100%;background:radial-gradient(circle at 30% 30%,#4f46e5,#1e1b4b);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 0 30px rgba(79,70,229,0.6),0 0 60px rgba(79,70,229,0.3),inset 0 0 20px rgba(255,255,255,0.2);animation:float 3s ease-in-out infinite,glow 2s ease-in-out infinite alternate;position:relative;border:3px solid rgba(255,255,255,0.1)}
#robot::before{content:'';position:absolute;top:-5px;left:-5px;right:-5px;bottom:-5px;background:conic-gradient(from 0deg,#4f46e5,#06b6d4,#8b5cf6,#4f46e5);border-radius:50%;z-index:-1;animation:rotate 3s linear infinite;opacity:0.7}
#robot::after{content:'👑';position:absolute;top:-15px;right:10px;font-size:20px;animation:bounce 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-10px)}}
@keyframes glow{0%{box-shadow:0 0 30px rgba(79,70,229,0.6),0 0 60px rgba(79,70,229,0.3)}100%{box-shadow:0 0 40px rgba(79,70,229,0.8),0 0 80px rgba(79,70,229,0.5)}}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#robot.mining{animation:float 0.5s ease-in-out infinite,mining 0.3s ease-in-out infinite}
@keyframes mining{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-5px) rotate(-2deg)}75%{transform:translateY(-5px) rotate(2deg)}}
#chat-bubble{position:absolute;bottom:130px;right:0;background:linear-gradient(135deg,#1e293b,#334155);color:#fff;padding:12px 18px;border-radius:20px 20px 5px 20px;max-width:250px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,0.3);opacity:0;transform:translateY(10px) scale(0.9);transition:all 0.4s cubic-bezier(0.68,-0.55,0.265,1.55);pointer-events:none;border:1px solid rgba(79,70,229,0.3)}
#chat-bubble.show{opacity:1;transform:translateY(0) scale(1)}
#chat-bubble::after{content:'';position:absolute;bottom:-8px;right:20px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #334155}
#status-dots{display:flex;gap:4px;margin-top:8px}
.dot{width:6px;height:6px;background:#4f46e5;border-radius:50%;animation:typing 1.4s infinite}
.dot:nth-child(2){animation-delay:0.2s}.dot:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-6px);opacity:1}}
#main-title{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff}
#main-title h1{font-size:3em;background:linear-gradient(90deg,#4f46e5,#06b6d4,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradient 3s ease infinite}
@keyframes gradient{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(20deg)}}
.stats{display:flex;gap:20px;margin-top:20px;justify-content:center}
.stat{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);padding:15px 25px;border-radius:15px;border:1px solid rgba(79,70,229,0.2)}
.stat-value{font-size:1.5em;font-weight:bold;color:#4f46e5}
</style>
</head>
<body>
<div id="main-title">
<h1>🤖👑 SHEIKHA ROBOT</h1>
<p style="margin-top:10px;opacity:0.7">روبوت شيخة الرقمي السيادي الجميل المتحرك - BOUND_BY_QURAN_SUNNAH</p>
<div class="stats">
<div class="stat"><div class="stat-value">9</div><div>Blocks #0-#8</div></div>
<div class="stat"><div class="stat-value">452</div><div>Weights</div></div>
<div class="stat"><div class="stat-value">86.75M</div><div>SHK</div></div>
<div class="stat"><div class="stat-value">3</div><div>Beneficiaries</div></div>
</div>
<p style="margin-top:20px;font-size:12px;opacity:0.5">ATOM_WATER_RASUL_JANNAH_SEALED - حجها لله - CR 2051263653</p>
</div>

<div id="robot-container">
<div id="robot">🤖</div>
<div id="chat-bubble">
<div id="bubble-text">مرحباً! أنا روبوت شيخة الرقمي 👑<br>أراقب 9 كتل و 452 وزن</div>
<div id="status-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>
</div>

<script>
const messages = [
  "مرحباً! أنا روبوت شيخة 👑<br>أراقب 9 كتل #0-#8",
  "452 وزن | 86.75M SHK<br>ثلاثة مستفيدين 170k SHK",
  "12 ركن + 8 عقول + 7 أدوار<br>BOUND_BY_QURAN_SUNNAH",
  "⛏️ أعدن Pearl Metal 15000MT<br>بالتكامل مع SBC 303",
  "📦 تداول HS 7214.20.00<br>سلاسل الإمداد العالمية",
  "🛡️ Guardian L0/L1/L2 PASSED<br>لا ربا لا غرر لا قمار",
  "🔗 Block #8 e99b653b...<br>متصل بـ b941bde4...",
  "🚀 Cloud Run 00059-lw5 100% LIVE<br>Zero Errors - نهاية لنهاية"
];
let msgIdx=0;
const robot=document.getElementById('robot');
const bubble=document.getElementById('chat-bubble');
const bubbleText=document.getElementById('bubble-text');
const container=document.getElementById('robot-container');

function showMessage(){
  bubbleText.innerHTML=messages[msgIdx];
  bubble.classList.add('show');
  robot.textContent=['🤖','👑','⛏️','📦','🛡️','🔗','🚀','💎'][msgIdx%8];
  robot.classList.add('mining');
  setTimeout(()=>{robot.classList.remove('mining');},800);
  msgIdx=(msgIdx+1)%messages.length;
}
function hideMessage(){bubble.classList.remove('show');}

container.addEventListener('click',()=>{
  if(bubble.classList.contains('show')){hideMessage();}else{showMessage();}
});

setInterval(()=>{showMessage();setTimeout(hideMessage,4000);},6000);

robot.addEventListener('mouseenter',()=>{robot.style.transform='scale(1.1)';});
robot.addEventListener('mouseleave',()=>{robot.style.transform='scale(1)';});

// حركة عشوائية جميلة مثل Copilot
let posX=0,posY=0;
setInterval(()=>{
  posX=(Math.random()-0.5)*10;
  posY=(Math.random()-0.5)*10;
  container.style.transform=`translate(${posX}px,${posY}px)`;
},3000);

showMessage();
setTimeout(hideMessage,3000);
</script>
</body>
</html>
