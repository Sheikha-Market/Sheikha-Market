<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محادثة شيخة الحية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #181818; color: #fff; font-family: 'Tajawal', Arial, sans-serif; margin: 0; padding: 0; }
        .chat-container { max-width: 480px; margin: 40px auto; background: #232323; border-radius: 16px; box-shadow: 0 2px 16px #0008; overflow: hidden; }
        .chat-header { background: linear-gradient(90deg,#D4AF37,#B87333); padding: 18px; font-size: 1.3em; font-weight: bold; text-align: center; letter-spacing: 1px; }
        .chat-messages { min-height: 320px; max-height: 400px; overflow-y: auto; padding: 18px; }
        .msg { margin-bottom: 16px; }
        .msg.user { text-align: left; color: #D4AF37; }
        .msg.sheikha { text-align: right; color: #B87333; }
        .chat-input { display: flex; border-top: 1px solid #333; background: #202020; }
        .chat-input input { flex: 1; padding: 14px; border: none; background: #202020; color: #fff; font-size: 1em; }
        .chat-input button { background: #D4AF37; color: #232323; border: none; padding: 0 24px; font-size: 1em; cursor: pointer; border-radius: 0 0 0 16px; transition: background 0.2s; }
        .chat-input button:hover { background: #B87333; color: #fff; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">محادثة شيخة الحية</div>
        <div class="chat-messages" id="messages"></div>
        <form class="chat-input" id="chatForm" autocomplete="off">
            <input type="text" id="userInput" placeholder="اكتب رسالتك..." required autofocus />
            <button type="submit">إرسال</button>
        </form>
    </div>
    <script>
        const messagesDiv = document.getElementById('messages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        function appendMsg(text, sender) {
            const div = document.createElement('div');
            div.className = 'msg ' + sender;
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;
            appendMsg(text, 'user');
            userInput.value = '';
            appendMsg('...جاري التفكير', 'sheikha');
            try {
                const res = await fetch('/api/sheikha/live-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                messagesDiv.lastChild.textContent = data.response || 'تعذر الحصول على رد.';
            } catch {
                messagesDiv.lastChild.textContent = 'حدث خطأ في الاتصال.';
            }
        };
        // رسالة ترحيب تلقائية
        appendMsg('مرحبًا بك في محادثة شيخة! اسألني أي شيء.', 'sheikha');
    </script>
</body>
</html>
