[Service]

# SHEIKHA OLLAMA LOCAL GPU RUNTIME
# Ollama 0.18 discovers the host GPU when CUDA_VISIBLE_DEVICES is unset.

Environment=OLLAMA_HOST=127.0.0.1:11434
Environment=OLLAMA_KEEP_ALIVE=45m
Environment=OLLAMA_LOAD_TIMEOUT=15m

Environment=NVIDIA_VISIBLE_DEVICES=all
Environment=NVIDIA_DRIVER_CAPABILITIES=compute,utility
Environment=OLLAMA_FLASH_ATTENTION=1

Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_MAX_LOADED_MODELS=1
Environment=OLLAMA_MAX_QUEUE=128

Environment=OMP_NUM_THREADS=12

Environment=OLLAMA_ORIGINS=http://127.0.0.1:8080,http://localhost:8080

Restart=always
RestartSec=3
Nice=-5

LimitNOFILE=1048576
LimitNPROC=65535
TasksMax=infinity
