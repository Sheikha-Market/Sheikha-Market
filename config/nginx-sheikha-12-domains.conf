# === SHEIKHA V24 UNIFIED NGINX REVERSE PROXY (12 HOSTINGER DOMAINS & SUB-BRANCHES) ===
# Target Production Node: Hostinger KVM 4 VPS (31.97.190.74)
# Unified SSL/TLS Command:
# sudo certbot --nginx -d sheikha.dev -d www.sheikha.dev -d sheikha.app -d www.sheikha.app -d sheikha.click -d www.sheikha.click -d sheikha.cloud -d www.sheikha.cloud -d sheikha.money -d www.sheikha.money -d sheikha.digital -d www.sheikha.digital -d sheikha.me -d www.sheikha.me -d sheikha.site -d www.sheikha.site -d sheikha.market -d www.sheikha.market -d sheikha.capital -d www.sheikha.capital -d sheikha.shop -d www.sheikha.shop -d sheikha.top -d www.sheikha.top --non-interactive --agree-tos -m market@sheikha.top

upstream sheikha_sovereign_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name sheikha.dev *.sheikha.dev sheikha.app *.sheikha.app sheikha.click *.sheikha.click sheikha.cloud *.sheikha.cloud sheikha.money *.sheikha.money sheikha.digital *.sheikha.digital sheikha.me *.sheikha.me sheikha.site *.sheikha.site sheikha.market *.sheikha.market sheikha.capital *.sheikha.capital sheikha.shop *.sheikha.shop sheikha.top *.sheikha.top;

    # خدمة الصور والوسائط مباشرة بصيغة image/jpeg حقيقية لـ SAP Business Network
    location /media/ {
        alias /home/sheikha/Projects/sheikha/sheikha-main-portal/public/media/;
        default_type image/jpeg;
        expires 365d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        proxy_pass http://sheikha_sovereign_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Sheikha-Domain $host;
    }
}
