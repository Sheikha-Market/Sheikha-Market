#!/usr/bin/env bash
# بسم الله الرحمن الرحيم
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  HAProxy Configuration — سوق شيخة الموزعة                                   ║
# ║  توزيع ذكي + health-aware routing + معلومات الحمل الفورية                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# التثبيت:
#   apt update && apt install -y haproxy
#
# النسخ:
#   cp config/haproxy.cfg /etc/haproxy/haproxy.cfg
#   systemctl restart haproxy
#   systemctl enable haproxy
#
# المراقبة:
#   curl http://localhost:8404/stats  (Dashboard)
#   systemctl status haproxy
#   journalctl -u haproxy -f

global
    # ─── التسجيل والحد الأقصى من الاتصالات ────────────────────────────────────
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096
    daemon
    
    # ─── الأداء ───────────────────────────────────────────────────────────────
    tune.ssl.default-dh-param 2048
    
    # ─── هوية النظام ──────────────────────────────────────────────────────────
    description "SHEIKHA Distributed Load Balancer"

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    option  redispatch
    
    # ─── المهل الزمنية (بالمللي ثانية) ────────────────────────────────────────
    timeout connect 5000
    timeout client  30000
    timeout server  30000
    timeout tunnel  3600000

# ─── الـ Stats Dashboard ───────────────────────────────────────────────────────
listen stats
    bind *:8404
    stats enable
    stats admin if TRUE
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node SHEIKHA-LB

# ═══════════════════════════════════════════════════════════════════════════════
# 🔴 Frontend — البوابة الأمامية
# ═══════════════════════════════════════════════════════════════════════════════
frontend sheikha_http
    # ─── المنفذ والتكوين ──────────────────────────────────────────────────────
    bind *:80
    # ملاحظة: فعّل HTTPS بعد إضافة الشهادة إلى المسار المحدد.
    # bind *:443 ssl crt /etc/haproxy/certs/sheikha.pem
    
    # ─── إعادة التوجيه HTTPS ──────────────────────────────────────────────────
    # redirect scheme https code 301 if !{ ssl_fc }
    
    # ─── تحديد الـ Backend بناءً على المسار ────────────────────────────────────
    acl is_api path_beg /api/
    acl is_market path_beg /سوق-شيخة
    acl is_admin path_beg /لوحة-الادمن
    acl is_docs path_beg /docs
    acl is_ws path_beg /ws
    acl is_health path_beg /api/health
    
    # ─── اختيار الـ Backend ───────────────────────────────────────────────────
    use_backend health_backend if is_health
    use_backend api_backend if is_api
    use_backend market_backend if is_market
    use_backend admin_backend if is_admin
    use_backend docs_backend if is_docs
    use_backend ws_backend if is_ws
    
    # ─── الـ Backend الافتراضي ────────────────────────────────────────────────
    default_backend main_backend

# ═══════════════════════════════════════════════════════════════════════════════
# 🟢 Backend — الطبقة الخلفية (التوزيع الذكي)
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Health Check Endpoint ────────────────────────────────────────────────────
backend health_backend
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /api/health ver HTTP/1.1 hdr Host sheikha.top
    
    # السيرفر الرئيسي
    server srv1 127.0.0.1:8080 check port 8080 weight 100 maxconn 200
    
    # السيرفر الثانوي (اختياري)
    # server srv2 X.X.X.X:8080 check port 8080 weight 50 maxconn 100 backup

# ─── API Endpoints ────────────────────────────────────────────────────────────
backend api_backend
    mode http
    balance leastconn             # توزيع بناءً على عدد الاتصالات النشطة
    option httpchk
    http-check send meth GET uri /api/health ver HTTP/1.1 hdr Host sheikha.top
    option forwardfor
    
    # ─── معالجة الأخطاء ───────────────────────────────────────────────────────
    default-server inter 10s fall 3 rise 2 slowstart 60s
    
    # السيرفرات
    server srv1 127.0.0.1:8080 check maxconn 200
    # server srv2 X.X.X.X:8080 check maxconn 200
    
    # إذا كل السيرفرات معطوبة، أرسل صفحة خطأ
    errorfile 503 /etc/haproxy/errors/503.http

# ─── Market (السوق) ───────────────────────────────────────────────────────────
backend market_backend
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /api/health ver HTTP/1.1 hdr Host sheikha.top
    
    server srv1 127.0.0.1:8080 check maxconn 300
    # server srv2 X.X.X.X:8080 check maxconn 300

# ─── Admin Panel (لوحة الإدارة) ────────────────────────────────────────────
backend admin_backend
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /api/health ver HTTP/1.1 hdr Host sheikha.top
    
    # تقييد الوصول: IP Whitelist اختياري
    # http-request deny if !{ src 192.168.1.0/24 }
    
    server srv1 127.0.0.1:8080 check maxconn 50
    # server srv2 X.X.X.X:8080 check maxconn 50

# ─── Docs ─────────────────────────────────────────────────────────────────────
backend docs_backend
    mode http
    balance roundrobin
    
    server srv1 127.0.0.1:8080 check maxconn 100

# ─── WebSocket ────────────────────────────────────────────────────────────────
backend ws_backend
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /api/health ver HTTP/1.1 hdr Host sheikha.top
    
    server srv1 127.0.0.1:8080 check maxconn 500
    # server srv2 X.X.X.X:8080 check maxconn 500

# ─── Main Backend (الـ Default) ────────────────────────────────────────────────
backend main_backend
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /api/health ver HTTP/1.1 hdr Host sheikha.top
    
    server srv1 127.0.0.1:8080 check maxconn 200
    # server srv2 X.X.X.X:8080 check maxconn 200
    
    # إعادة محاولة الطلب في حالة الفشل
    retries 3

# ═══════════════════════════════════════════════════════════════════════════════
# 📌 ملاحظات الاستخدام
# ═══════════════════════════════════════════════════════════════════════════════
# 1. استبدل X.X.X.X بـ IP السيرفر الثاني
# 2. قم بـ uncomment السيرفرات الثانوية عند الحاجة
# 3. اختبر الـ Config:  haproxy -c -f /etc/haproxy/haproxy.cfg
# 4. اعرض الـ Stats:   curl http://localhost:8404/stats
# 5. Logs:            tail -f /var/log/haproxy.log
