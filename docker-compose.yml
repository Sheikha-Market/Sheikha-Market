# 🕌 نظام شيخة الموحد — نسخة Docker Compose
# Sheikha Unified System — Docker Compose Configuration

version: '3.9'

services:
  # ========================================================================
  # الخادم الرئيسي — Main Server
  # ========================================================================
  sheikha-main:
    build:
      context: .
      dockerfile: Dockerfile
    image: sheikha-os:3.0
    container_name: sheikha-os-main
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9090:9090"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/sheikha
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      LOG_LEVEL: info
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./public:/app/public:ro
      - ./js:/app/js:ro
    depends_on:
      - mongo
      - redis
    networks:
      - sheikha-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"

  # ========================================================================
  # قاعدة البيانات — MongoDB
  # ========================================================================
  mongo:
    image: mongo:7.0-alpine
    container_name: sheikha-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sheikha
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change-this}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - sheikha-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========================================================================
  # الذاكرة المؤقتة — Redis
  # ========================================================================
  redis:
    image: redis:7-alpine
    container_name: sheikha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-this}
    volumes:
      - redis-data:/data
    networks:
      - sheikha-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================================
  # مراقبة الأداء — Prometheus
  # ========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: sheikha-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - sheikha-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - sheikha-main

  # ========================================================================
  # لوحة التصور — Grafana
  # ========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: sheikha-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - sheikha-network
    depends_on:
      - prometheus

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  sheikha-network:
    driver: bridge
